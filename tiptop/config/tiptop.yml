# TiPToP Configuration for DROID setup

# == Robot connection and control ==
robot:
  type: panda
  dof: 7

  # IP address or hostname of the workstation running the Bamboo controller (directly networked to robot)
  host: "128.30.24.62"

  # Bamboo robot and gripper control port. You don't need to change these unless you used custom ports
  port: 5555
  gripper_port: 5559

  # == Speed ratio for motions (0.0 to 1.0) ==
  # This corresponds to the speed of the robot
  # Start with 0.2 for safety, we DO NOT recommend going beyond 0.6 for safety
  # We use 0.6 on our setup at MIT, where we have managed the camera USB cable carefully
  time_dilation_factor: 0.2

  # Robot configurations
  q_home: [0.0, -0.628, 0.0, -2.513, 0.0, 1.885, 0.0]
  q_capture: [0.17539433712398664, -1.4101397038183257, 0.0778409981779885, -2.1528537666588496, -0.16391687889838094, 1.402763007161269, -0.6963768175314127] 
  #q_capture: [0.14383115793570544, -1.6496692239471344, -0.09040299987201529, -2.670572545930934, -0.12891004397471745, 1.725358803889352, -2.2958850445118215]
  #q_capture: [0.09182040738001353, -1.7596653633613568, -0.07610120523668563, -2.989139779475697, -0.03324042674962227, 2.0085827458795786, 0.7514896069202158]

# == Camera configurations ==
# Supported types: zed, realsense
# ZED cameras support optional resolution and fps settings:
#   HD720: 15/30/60 fps, HD1080: 15/30 fps, HD2K: 15 fps
#   If not specified, defaults to HD720 at 60 fps
# RealSense cameras only require serial and type (resolution and fps are not supported)
cameras:
  # TiPToP only uses the hand camera for perception
  hand:
    serial: "16737879"
    type: zed

  # External camera is optional but helpful for recording execution and scene visualization script (viz-scene)
  external:
    serial: "127122270412"
    type: realsense
perception:
  foundation_stereo:
    url: "http://localhost:1234"

  m2t2:
    url: "http://localhost:8123"
    # Set to false when world coordinate frame differs from the robot base link frame
    apply_bounds: true

  sam:
    mode: "local"

  recgen:
    # ===== EXPERIMENTAL =====
    # We support RecGen (https://reconstruction-by-generation.github.io) for shape completion instead of convex hulls.
    # This is typically set to false as RecGen is significantly slower than convex hulls.
    # For instructions to set up the RecGen server, see: https://github.com/williamshen-nz/recgen
    # We recommend running it on a multi-GPU machine to speed up inference, as we generate completions per-object.
    url: "http://<endpoint>:18324"
    enabled: false
    # Target mesh face count per object via decimation (applied server-side). Set to null to disable (huge meshes).
    target_faces: 10000
    # Maximum concurrent requests to RecGen inference server. Set at or slightly above gateway's GPU count.
    concurrency: 6

  # Perception hyperparameters
  depth_trunc_m: 5.0             # Depth truncation threshold in meters
  voxel_downsample_size: 0.0075  # Point cloud downsampling in meters before feeding into M2T2
  contact_threshold_m: 0.01      # Grasp-object association distance threshold
  mask_erosion_pixels: 3         # Pixels to erode segmentation masks to reduce noise

# == Experimental features ==
experimental:
  # Enables "place X next to Y" goals via the Near(x, y) predicate in cuTAMP.
  # Placement distance tolerances default to cuTAMP's NearPlacement value of 5cm (5e-2).
  # See default_constraint_to_tol in https://github.com/tiptop-robot/cuTAMP/blob/main/cutamp/scripts/utils.py
  pick_place_next_to: false
